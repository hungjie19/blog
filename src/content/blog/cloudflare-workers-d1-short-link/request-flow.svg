<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">短網址請求處理流程</title>
  <desc id="desc">瀏覽器把短網址請求送到 Cloudflare Worker。Worker 正規化路徑後查詢 D1 links 表，收到目標網址後回傳 302。Worker 同時使用 waitUntil 在背景將請求寫入 D1 clicks 表。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans TC", "PingFang TC", sans-serif; }
      .ink { fill: #0f172a; }
      .muted { fill: #64748b; }
      .small { font-size: 15px; }
      .label { font-size: 17px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="28" fill="#f8fafc" />
  <text x="72" y="58" font-size="14" font-weight="700" letter-spacing="2.4" fill="#2563eb">REQUEST FLOW</text>
  <text x="72" y="106" class="ink" font-size="34" font-weight="700">一個短網址請求如何完成轉址？</text>
  <text x="72" y="139" class="muted" font-size="18">Worker 查詢目的地，點擊紀錄在背景寫入。</text>

  <rect x="1047" y="45" width="158" height="36" rx="18" fill="#dbeafe" />
  <circle cx="1068" cy="63" r="5" fill="#2563eb" />
  <text x="1082" y="69" font-size="14" font-weight="600" fill="#1d4ed8">轉址主流程</text>
  <rect x="1216" y="45" width="164" height="36" rx="18" fill="#ffedd5" />
  <circle cx="1237" cy="63" r="5" fill="#ea580c" />
  <text x="1251" y="69" font-size="14" font-weight="600" fill="#c2410c">背景寫入</text>

  <rect x="72" y="170" width="380" height="94" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="1.5" />
  <rect x="570" y="170" width="380" height="94" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
  <rect x="1068" y="170" width="300" height="94" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />

  <rect x="98" y="195" width="44" height="34" rx="6" fill="none" stroke="#64748b" stroke-width="2" />
  <path d="M98 205h44" stroke="#64748b" stroke-width="2" />
  <circle cx="106" cy="200" r="2" fill="#64748b" />
  <circle cx="113" cy="200" r="2" fill="#64748b" />
  <text x="158" y="207" class="ink" font-size="21" font-weight="700">瀏覽器</text>
  <text x="158" y="233" class="muted" font-size="15">發出短網址請求</text>

  <rect x="596" y="195" width="44" height="44" rx="12" fill="#f38020" />
  <text x="618" y="225" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">W</text>
  <text x="657" y="207" class="ink" font-size="21" font-weight="700">Cloudflare Worker</text>
  <text x="657" y="233" class="muted" font-size="15">接收請求、查詢、回應</text>

  <ellipse cx="1100" cy="198" rx="17" ry="7" fill="none" stroke="#2563eb" stroke-width="2" />
  <path d="M1083 198v28c0 4 8 7 17 7s17-3 17-7v-28" fill="none" stroke="#2563eb" stroke-width="2" />
  <path d="M1083 212c0 4 8 7 17 7s17-3 17-7" fill="none" stroke="#2563eb" stroke-width="2" />
  <text x="1130" y="207" class="ink" font-size="21" font-weight="700">D1</text>
  <text x="1130" y="233" class="muted" font-size="15">保存連結和請求紀錄</text>

  <rect x="72" y="282" width="380" height="532" rx="20" fill="#ffffff" stroke="#e2e8f0" />
  <rect x="570" y="282" width="380" height="532" rx="20" fill="#ffffff" stroke="#e2e8f0" />
  <rect x="1068" y="282" width="300" height="532" rx="20" fill="#ffffff" stroke="#e2e8f0" />

  <line x1="262" y1="292" x2="262" y2="802" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 8" />
  <line x1="760" y1="292" x2="760" y2="802" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 8" />
  <line x1="1218" y1="292" x2="1218" y2="802" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 8" />

  <line x1="262" y1="322" x2="760" y2="322" stroke="#2563eb" stroke-width="3" />
  <polygon points="760,314 776,322 760,330" fill="#2563eb" />
  <rect x="375" y="292" width="274" height="34" rx="17" fill="#dbeafe" />
  <text x="512" y="315" text-anchor="middle" class="label" fill="#1d4ed8">1　GET /&lt;分類&gt;/&lt;短網址&gt;</text>

  <rect x="606" y="359" width="308" height="78" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <circle cx="632" cy="385" r="13" fill="#f38020" />
  <text x="632" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="656" y="386" class="ink" font-size="17" font-weight="700">檢查 method、正規化路徑</text>
  <text x="632" y="417" class="muted small">整理 slug，再查找對應的長網址</text>

  <line x1="914" y1="488" x2="1088" y2="488" stroke="#2563eb" stroke-width="3" />
  <polygon points="1088,480 1104,488 1088,496" fill="#2563eb" />
  <rect x="884" y="450" width="230" height="32" rx="16" fill="#dbeafe" />
  <text x="999" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">2　SELECT links WHERE slug = ?</text>

  <rect x="1090" y="510" width="256" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="1110" y="540" class="ink" font-size="18" font-weight="700">links</text>
  <text x="1110" y="564" class="muted small">slug → target</text>

  <line x1="1090" y1="620" x2="914" y2="620" stroke="#2563eb" stroke-width="3" />
  <polygon points="914,612 898,620 914,628" fill="#2563eb" />
  <rect x="948" y="588" width="128" height="30" rx="15" fill="#dbeafe" />
  <text x="1012" y="609" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">3　目標網址</text>

  <line x1="606" y1="690" x2="262" y2="690" stroke="#2563eb" stroke-width="3" />
  <polygon points="262,682 246,690 262,698" fill="#2563eb" />
  <rect x="369" y="654" width="210" height="32" rx="16" fill="#dbeafe" />
  <text x="474" y="676" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">4　回傳 302 Location</text>

  <line x1="262" y1="690" x2="262" y2="719" stroke="#64748b" stroke-width="2.5" />
  <polygon points="254,719 270,719 262,735" fill="#64748b" />
  <rect x="96" y="725" width="332" height="62" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="262" y="751" text-anchor="middle" class="ink" font-size="16" font-weight="700">瀏覽器依 Location 前往目的地</text>
  <text x="262" y="773" text-anchor="middle" class="muted small">這是收到 302 後的下一個請求</text>

  <line x1="914" y1="758" x2="1088" y2="758" stroke="#ea580c" stroke-width="3" stroke-dasharray="9 7" />
  <polygon points="1088,750 1104,758 1088,766" fill="#ea580c" />
  <rect x="904" y="716" width="254" height="34" rx="17" fill="#ffedd5" />
  <text x="1031" y="739" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">5　waitUntil 寫入 clicks</text>
  <rect x="1090" y="778" width="256" height="30" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <text x="1218" y="799" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">clicks：背景記錄請求</text>

  <text x="72" y="858" class="muted" font-size="15">藍色：轉址主流程　　橘色虛線：背景寫入，不必等記錄完成才回傳 302</text>
</svg>
